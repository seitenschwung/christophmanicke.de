# Request form: at most 5 requests a minute per client (burst 3), see location /api/anfrage.
limit_req_zone $binary_remote_addr zone=anfrage:1m rate=5r/m;

# Old and www addresses forward permanently to the main domain, so Google indexes one copy only.
# /healthz and /version.txt stay reachable on every name: the deploy pipeline checks the version on
# christophmanicke.de and rolls back if it gets anything else.
server {
    listen 8080;
    server_name www.christophmanicke.de;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /version.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://christophmanicke.de$request_uri;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Request form -> mailer service (docker-compose). Resolved at request time through Docker's DNS, so nginx
    # also starts without the mailer (CI); then this answers 502 and the page falls back to the visitor's mail program.
    location = /api/anfrage {
        limit_except POST { deny all; }
        # Client IP from the proxy in front (Coolify/Traefik, private Docker network) for the limits; only here, so
        # the other log lines stay as they were.
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        limit_req zone=anfrage burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        client_body_buffer_size 16k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 3s;
        set $mailer http://mailer:3000;
        proxy_pass $mailer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
    }

    location = /version.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # HTML, CSS and JS are not fingerprinted: browsers must revalidate (ETag) on every load,
    # so a deploy is never shown as a mix of old and new files. `expires` keeps the headers above.
    location ~* \.(?:html|css|js)$ {
        expires -1;
    }

    # Font files never change in place (a new weight gets a new file name), so browsers keep them for a year.
    location ~* \.woff2$ {
        expires 1y;
    }

    location ~* \.(?:webp|png|jpe?g|svg|ico|mp4|webm)$ {
        expires 1d;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
